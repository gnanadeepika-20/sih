<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SkillQuest - Creative Challenge</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-surface": "#1b1b24",
                    "surface-container-low": "#f5f2ff",
                    "on-error-container": "#93000a",
                    "on-primary": "#ffffff",
                    "tertiary-fixed": "#ffdbcc",
                    "inverse-on-surface": "#f3effc",
                    "on-tertiary": "#ffffff",
                    "on-background": "#1b1b24",
                    "on-secondary-fixed": "#1b1b1c",
                    "tertiary-container": "#a44100",
                    "on-secondary-fixed-variant": "#474647",
                    "primary-container": "#4f46e5",
                    "secondary-fixed-dim": "#c8c6c7",
                    "surface-bright": "#fcf8ff",
                    "tertiary-fixed-dim": "#ffb695",
                    "on-error": "#ffffff",
                    "on-primary-fixed": "#0f0069",
                    "surface-container-highest": "#e4e1ee",
                    "surface-container": "#f0ecf9",
                    "inverse-primary": "#c3c0ff",
                    "secondary": "#5f5e5f",
                    "on-tertiary-container": "#ffd2be",
                    "primary-fixed": "#e2dfff",
                    "primary-fixed-dim": "#c3c0ff",
                    "background": "#fcf8ff",
                    "outline-variant": "#c7c4d8",
                    "outline": "#777587",
                    "inverse-surface": "#302f39",
                    "surface": "#fcf8ff",
                    "error-container": "#ffdad6",
                    "on-primary-fixed-variant": "#3323cc",
                    "error": "#ba1a1a",
                    "on-secondary": "#ffffff",
                    "surface-variant": "#e4e1ee",
                    "on-tertiary-fixed-variant": "#7b2f00",
                    "surface-container-high": "#eae6f4",
                    "on-primary-container": "#dad7ff",
                    "on-surface-variant": "#464555",
                    "surface-tint": "#4d44e3",
                    "secondary-container": "#e2dfe0",
                    "on-secondary-container": "#636263",
                    "surface-container-lowest": "#ffffff",
                    "primary": "#3525cd",
                    "surface-dim": "#dcd8e5",
                    "on-tertiary-fixed": "#351000",
                    "secondary-fixed": "#e5e2e3",
                    "tertiary": "#7e3000"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-desktop": "64px",
                    "container-max": "1200px",
                    "unit": "8px",
                    "section-gap": "120px",
                    "margin-mobile": "20px",
                    "gutter": "24px"
            },
            "fontFamily": {
                    "body-sm": ["Inter"],
                    "body-lg": ["Inter"],
                    "title-sm": ["Inter"],
                    "label-caps": ["Inter"],
                    "headline-md-mobile": ["Inter"],
                    "hero-lg-mobile": ["Inter"],
                    "hero-lg": ["Inter"],
                    "headline-md": ["Inter"]
            },
            "fontSize": {
                    "body-sm": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "title-sm": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "label-caps": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "headline-md-mobile": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "hero-lg-mobile": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "hero-lg": ["64px", {"lineHeight": "72px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "headline-md": ["42px", {"lineHeight": "52px", "letterSpacing": "-0.01em", "fontWeight": "700"}]
            }
          }
        }
      }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-sm antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopNavBar -->
<header class="bg-surface-container-low dark:bg-surface-container-lowest docked full-width top-0 w-full z-50">
<div class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop h-16 max-w-container-max mx-auto">
<div class="font-title-sm text-title-sm font-black text-primary dark:text-inverse-primary">
                SkillQuest
            </div>
<nav class="hidden md:flex items-center space-x-8">
<!-- Transition screen, no active nav mapped -->
</nav>
<div class="flex items-center">
<button class="text-on-surface-variant hover:opacity-80 transition-opacity p-2 rounded-full focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col justify-center items-center px-margin-mobile md:px-margin-desktop py-section-gap relative overflow-hidden">
<!-- Abstract Shapes Background Element -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20 flex justify-center items-center">
<div class="w-[800px] h-[800px] bg-gradient-to-br from-primary-fixed to-tertiary-fixed rounded-full blur-3xl mix-blend-multiply"></div>
</div>
<div class="max-w-[800px] w-full z-10 text-center relative">
<!-- Floating Visual Elements (CSS Animated) -->
<div aria-hidden="true" class="relative w-full h-64 md:h-80 mb-12">
<!-- Block 1 -->
<div class="absolute top-1/4 left-1/4 w-16 h-16 bg-primary rounded-lg shadow-lg animate-[float_6s_ease-in-out_infinite]" style="animation-delay: 0s;"></div>
<!-- Block 2 -->
<div class="absolute top-1/2 right-1/3 w-20 h-20 bg-tertiary-container rounded-full shadow-lg animate-[float_7s_ease-in-out_infinite]" style="animation-delay: -2s;"></div>
<!-- Block 3 -->
<div class="absolute bottom-1/4 left-1/3 w-24 h-12 bg-secondary rounded-xl shadow-lg animate-[float_8s_ease-in-out_infinite]" style="animation-delay: -4s; transform: rotate(15deg);"></div>
<!-- Central Element -->
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-32 h-32 bg-surface border border-outline-variant rounded-2xl shadow-xl flex items-center justify-center animate-[pulse_4s_ease-in-out_infinite]">
<span class="material-symbols-outlined text-6xl text-primary" data-icon="lightbulb" style="font-variation-settings: 'FILL' 1;">lightbulb</span>
</div>
</div>
</div>
<!-- Typography -->
<h1 class="font-hero-lg-mobile text-hero-lg-mobile md:font-hero-lg md:text-hero-lg text-on-surface mb-6 tracking-tight">
                Now let's see how you create.
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl mx-auto mb-12">
                Not every problem has one right answer. Experiment, build, and show us how you think.
            </p>
<!-- Indicators -->
<div class="flex flex-wrap justify-center gap-4 mb-16">
<div class="flex items-center gap-2 bg-surface-container px-4 py-2 rounded-full border border-outline-variant">
<span class="w-2 h-2 rounded-full bg-primary"></span>
<span class="font-label-caps text-label-caps text-on-surface">CREATIVITY</span>
</div>
<div class="flex items-center gap-2 bg-surface-container px-4 py-2 rounded-full border border-outline-variant">
<span class="w-2 h-2 rounded-full bg-tertiary-container"></span>
<span class="font-label-caps text-label-caps text-on-surface">EXPERIMENTATION</span>
</div>
<div class="flex items-center gap-2 bg-surface-container px-4 py-2 rounded-full border border-outline-variant">
<span class="w-2 h-2 rounded-full bg-secondary"></span>
<span class="font-label-caps text-label-caps text-on-surface">SPATIAL THINKING</span>
</div>
<div class="flex items-center gap-2 bg-surface-container px-4 py-2 rounded-full border border-outline-variant">
<span class="w-2 h-2 rounded-full bg-primary-container"></span>
<span class="font-label-caps text-label-caps text-on-surface">DESIGN SENSE</span>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col sm:flex-row items-center justify-center gap-6">
<button class="w-full sm:w-auto bg-primary text-on-primary font-title-sm text-title-sm px-8 py-4 rounded-[16px] hover:bg-on-primary-fixed-variant transition-all transform hover:-translate-y-1 hover:shadow-lg flex items-center justify-center gap-2 group">
                    Start Creative Challenge
                    <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
<button class="w-full sm:w-auto bg-transparent border border-outline text-on-surface font-title-sm text-title-sm px-8 py-4 rounded-[16px] hover:bg-surface-container transition-colors">
                    How this works
                </button>
</div>
</div>
</main>
<style>
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</body></html>
