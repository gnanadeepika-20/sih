<!DOCTYPE html>

                      "surface-container-highest": "#e4e1ee",
                      "surface-container": "#f0ecf9",

                      "outline": "#777587",
                      "inverse-surface": "#302f39",
                      "surface": "#fcf8ff",
                      "error-container": "#ffdad6",

                      "error": "#ba1a1a",
                      "on-secondary": "#ffffff",

                      "on-tertiary-fixed-variant": "#7b2f00",

                      "surface-dim": "#dcd8e5",

              "fontFamily": {

                      "body-lg": [

                      "label-caps": [

                      "headline-md-mobile": [

<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-sm text-body-sm">
<!-- TopNavBar (Transactional/Assessment Intent - using standard TopNavBar style) -->
<header class="bg-surface-container-low dark:bg-surface-container-lowest docked full-width top-0 w-full z-50 transition-all duration-300">
<div class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop h-16 max-w-container-max mx-auto">
<div class="font-title-sm text-title-sm font-black text-primary dark:text-inverse-primary cursor-pointer hover:opacity-80 transition-opacity">
                SkillQuest
            </div>
<div class="flex items-center space-x-gutter">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container-high transition-colors text-on-surface-variant hover:opacity-80">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
</div>
</header>
<main class="flex-grow flex flex-col max-w-container-max mx-auto w-full px-margin-mobile md:px-margin-desktop py-8 gap-gutter relative">
<!-- Assessment Header -->
<div class="w-full flex justify-between items-center mb-4">
<h1 class="font-headline-md-mobile md:font-headline-md text-headline-md-mobile md:text-headline-md text-on-surface">DESIGN &amp; CREATIVITY | Powder Sandbox</h1>
<div class="text-on-surface-variant font-label-caps text-label-caps bg-surface-container-high px-4 py-2 rounded-full">
                TIME: 15:00
            </div>
</div>
<div class="flex flex-col lg:flex-row gap-gutter w-full h-full min-h-[600px]">
<!-- LEFT: Toolbox -->
<aside class="lg:w-64 w-full flex-shrink-0 flex flex-col gap-4">
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-6 shadow-[0px_4px_20px_rgba(0,0,0,0.04)] h-full flex flex-col">
<h2 class="font-title-sm text-title-sm text-on-surface mb-6 border-b border-outline-variant pb-2">Tools</h2>
<div class="flex flex-col gap-3">
<button class="flex items-center gap-3 p-3 rounded-lg bg-surface-container hover:bg-surface-container-high transition-colors text-on-surface font-body-lg text-body-lg text-left group">
<span class="material-symbols-outlined text-tertiary-container group-hover:scale-110 transition-transform" data-icon="grain">grain</span>
                            Sand
                        </button>
<button class="flex items-center gap-3 p-3 rounded-lg hover:bg-surface-container-high transition-colors text-on-surface font-body-lg text-body-lg text-left group">
<span class="material-symbols-outlined text-primary-container group-hover:scale-110 transition-transform" data-icon="water_drop">water_drop</span>
                            Water
                        </button>
<button class="flex items-center gap-3 p-3 rounded-lg hover:bg-surface-container-high transition-colors text-on-surface font-body-lg text-body-lg text-left group">
<span class="material-symbols-outlined text-secondary group-hover:scale-110 transition-transform" data-icon="wall_art">wall_art</span>
                            Wall
                        </button>
<button class="flex items-center gap-3 p-3 rounded-lg hover:bg-surface-container-high transition-colors text-error transition-colors font-body-lg text-body-lg text-left group mt-auto">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform" data-icon="ink_eraser">ink_eraser</span>
                            Eraser
                        </button>
</div>
</div>
</aside>
<!-- CENTER: Interactive Canvas -->
<section class="flex-grow flex flex-col gap-4">
<div class="bg-surface-container-lowest border border-outline-variant rounded-[32px] overflow-hidden shadow-[inset_0_4px_20px_rgba(0,0,0,0.02)] h-full relative group">
<!-- Placeholder for Sandbox Canvas -->
<div class="absolute inset-0 bg-surface-bright flex items-center justify-center">
<div class="text-center text-on-surface-variant opacity-50 flex flex-col items-center">
<span class="material-symbols-outlined text-[64px] mb-4" data-icon="touch_app">touch_app</span>
<p class="font-body-lg text-body-lg">Interactive Canvas Area</p>
</div>
</div>
<!-- Decorative overlay to simulate content -->
<div class="absolute bottom-10 left-10 w-32 h-32 bg-tertiary-container rounded-full opacity-20 blur-xl"></div>
<div class="absolute top-20 right-20 w-48 h-48 bg-primary-container rounded-full opacity-10 blur-2xl"></div>
<!-- Canvas controls overlay -->
<div class="absolute top-4 right-4 flex gap-2 bg-surface-container-lowest/80 backdrop-blur-sm p-2 rounded-full border border-outline-variant">
<button class="p-2 text-on-surface hover:text-primary transition-colors rounded-full hover:bg-surface-container">
<span class="material-symbols-outlined text-[20px]" data-icon="undo">undo</span>
</button>
<button class="p-2 text-on-surface hover:text-primary transition-colors rounded-full hover:bg-surface-container">
<span class="material-symbols-outlined text-[20px]" data-icon="redo">redo</span>
</button>
<button class="p-2 text-on-surface hover:text-error transition-colors rounded-full hover:bg-error-container">
<span class="material-symbols-outlined text-[20px]" data-icon="delete">delete</span>
</button>
</div>
</div>
</section>
<!-- RIGHT: Stats -->
<aside class="lg:w-72 w-full flex-shrink-0 flex flex-col gap-4">
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-6 shadow-[0px_4px_20px_rgba(0,0,0,0.04)] h-full flex flex-col">
<h2 class="font-title-sm text-title-sm text-on-surface mb-6 border-b border-outline-variant pb-2">Experiment Stats</h2>
<div class="flex flex-col gap-6 flex-grow">
<div>
<div class="flex justify-between items-center mb-2">
<span class="font-label-caps text-label-caps text-on-surface-variant">Materials Used</span>
<span class="font-body-lg text-body-lg font-bold text-primary">3/4</span>
</div>
<div class="w-full bg-surface-container-high rounded-full h-2">
<div class="bg-primary h-2 rounded-full" style="width: 75%"></div>
</div>
</div>
<div>
<div class="flex justify-between items-center mb-2">
<span class="font-label-caps text-label-caps text-on-surface-variant">Objects Created</span>
<span class="font-body-lg text-body-lg font-bold text-tertiary">18</span>
</div>
</div>
<div>
<div class="flex justify-between items-center mb-2">
<span class="font-label-caps text-label-caps text-on-surface-variant">Creativity Score</span>
<span class="font-body-lg text-body-lg font-bold text-primary">72%</span>
</div>
<div class="w-full bg-surface-container-high rounded-full h-2">
<div class="bg-tertiary-container h-2 rounded-full" style="width: 72%"></div>
</div>
<p class="text-on-surface-variant text-sm mt-2">Moderate complexity detected. Try combining elements.</p>
</div>
</div>
<button class="w-full mt-6 bg-primary text-on-primary font-title-sm text-title-sm py-4 px-8 rounded-[16px] hover:bg-on-primary-fixed-variant transition-colors flex items-center justify-center gap-2 group">
                        Finish Experiment
                        <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</aside>
</div>
</main>
</body></html>
