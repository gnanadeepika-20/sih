<!DOCTYPE html>

<head>

<style>

<!-- STITCH_SVG_START:ANIMATION_33 class="fixed inset-0 w-full h-full" --><div class="fixed inset-0 w-full h-full" id="animated-svg-ANIMATION_33" style="display:block;"><svg viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

</path>
<!-- Right Ear -->
<path d="M55,38 Q50,5 60,5 Q70,5 65,38" fill="#FFFFFF" stroke="#000000" stroke-width="0.5">
<animatetransform attributename="transform" dur="3.5s" repeatcount="indefinite" type="rotate" values="0 55 38; 5 55 38; 0 55 38"></animatetransform>
</path>
<!-- Paws (Holding the carrot) -->
<circle cx="40" cy="65" fill="#FFFFFF" r="4" stroke="#000000" stroke-width="0.5">

<circle cx="60" cy="65" fill="#FFFFFF" r="4" stroke="#000000" stroke-width="0.5">

<circle cx="43" cy="55" fill="#000000" r="2"></circle>
<circle cx="57" cy="55" fill="#000000" r="2"></circle>

<line stroke="#000000" stroke-width="0.5" x1="50" x2="50" y1="58" y2="60"></line>

<g>
<!-- Carrot Root -->
<path d="M45,65 Q50,85 55,65 Z" fill="#FF8C42" stroke="#000000" stroke-width="0.5">
<animatetransform attributename="transform" dur="2s" repeatcount="indefinite" type="scale" values="1,1; 1.05,1; 1,1"></animatetransform>
